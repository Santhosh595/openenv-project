# CI: run the test suite on every push to main and every PR targeting it.
#
# The suite covers the environment the trained policy is graded against:
# the scenario and action-space definitions, the cost and transit tables,
# reset determinism, and the reward for a malformed action. The
# environment is seeded and does no network I/O, so the suite runs
# offline and deterministically.
#
# Actions are pinned by full SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v
